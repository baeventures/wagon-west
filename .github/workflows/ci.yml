name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Smoke-run the balance simulator so sim.py can't rot: catches syntax
      # errors and crashes, not balance drift (n is far too small for that —
      # real validation is n=4000 per HANDOFF.md).
      - name: Simulator smoke
        run: python3 tools/sim.py 120
